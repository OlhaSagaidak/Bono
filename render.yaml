# Render Blueprint: the Bono web app and its Postgres database.
# Create both from the Render Dashboard: New > Blueprint > this repo.
# Both on the smallest paid plans since Nov 2026, so the demo never sleeps
# and stays up through judging (Dec 1-15).

services:
  - type: web
    name: bono
    runtime: node
    plan: starter
    region: oregon
    # The embedding model (~23 MB) is downloaded at build time, so the server never fetches it.
    buildCommand: npm ci && npm run build && npm run models:fetch
    # Migrations run once per deploy, before the new version goes live (they only
    # apply what's new). If one fails, the deploy stops and the old version keeps serving.
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: bono-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      # Secrets: Render asks for these once, when the Blueprint is created.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_PLATFORM_MERCHANT_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # AG Studio licence. NEXT_PUBLIC_ values are built into the page, so it must be set before a build.
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      - key: VERIFICATION_FEE_CENTS
        value: "2500"
      - key: BOOST_FEE_CENTS
        value: "1500"
      - key: BOOST_DAYS
        value: "7"

databases:
  - name: bono-db
    # Upgraded 2026-11-05 so the demo stays up through judging (Dec 1-15).
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: bono
    user: bono
